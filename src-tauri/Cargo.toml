[package]
name = "snapx"
version = "0.1.0"
description = "SnapX - Lightweight screenshot, annotation & pin tool"
authors = ["OC大厨"]
edition = "2021"

[lib]
name = "snapx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
xcap = "0.0.14"

# Native OCR on Windows via Windows.Media.Ocr (fully offline, on-device).
# Platform-gated so non-Windows builds don't pull the windows crate at all.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }
