[package]
name = "snapx"
version = "0.1.0"
description = "SnapX - Lightweight screenshot, annotation & pin tool"
authors = ["OC大厨"]
edition = "2021"

[lib]
name = "snapx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
base64 = "0.22"
xcap = "0.0.14"

# On-device OCR via PaddleOCR (PP-OCRv5) on the MNN inference backend.
# Pure-Rust, fully offline, cross-platform — replaces the Windows-only
# Windows.Media.Ocr engine and recognises mixed CN/EN out of the box.
ocr-rs = "2.2"

# Compile dependencies with optimizations even in dev mode.
# This massively speeds up image encoding (PNG) and base64 — 1100ms → ~80ms
# for 4K captures — while keeping the main crate debuggable.
[profile.dev.package."*"]
opt-level = 2
